name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A read-only token is all these checks need. Anything more would be handed to
# workflow runs triggered by pull requests from forks.
permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide how the others fared.
      fail-fast: false
      matrix:
        # The endpoints only (ADR-0016). 3.11 is the floor: the config validator reads TOML
        # with `tomllib`. These tests exercise `git`, `tmux` stubs and process lifecycles, not
        # version-sensitive language surface, so the interior versions bought almost nothing.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Check the vendored Review-Switch bridge
        if: matrix.python-version == '3.11'
        run: |
          scripts/sync-bridge.sh
          git diff --exit-code -- skills/crew/assets/review/scripts/tui_review_bridge.py

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The validator is stdlib-only, but the review bridge talks to the Codex app server over
      # a websocket, so its suite cannot be loaded without aiohttp.
      - name: Install the review bridge's dependency
        run: python3 -m pip install --disable-pip-version-check aiohttp

      - name: Validate the plugin tree
        run: python3 scripts/validate_plugin_tree.py

      - name: Run the test suite
        run: python3 scripts/test.py
