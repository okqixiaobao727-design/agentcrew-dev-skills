name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref, and only the newest. A content commit and the release commit behind it land a
# minute apart, and the first run is obsolete before it is a third of the way through; without
# this it finishes anyway. Cancelling reaches `main` too, so an intermediate commit's own run
# reads `cancelled` rather than `passed` — the tree that matters is the one at the tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A read-only token is all these checks need. Anything more would be handed to
# workflow runs triggered by pull requests from forks.
permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide how the others fared.
      fail-fast: false
      matrix:
        # The endpoints only (ADR-0016). 3.11 is the floor: the config validator reads TOML
        # with `tomllib`. These tests exercise `git`, `tmux` stubs and process lifecycles, not
        # version-sensitive language surface, so the interior versions bought almost nothing.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Validate the plugin tree
        run: python3 scripts/validate_plugin_tree.py

      - name: Run the test suite
        run: python3 scripts/test.py
