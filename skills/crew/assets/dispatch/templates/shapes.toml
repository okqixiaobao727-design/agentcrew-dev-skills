# The renderer's first-turn library: the turn skeleton, one shape per `Workflow` value, and one
# review-lane variant per reviewing vendor. The dispatch renderer is the only reader; the crew
# skill body states none of this prose, so the text a child receives and the code that composes it
# cannot drift apart.
#
# Every `<token>` a block leaves open is filled from the approved wave table. Tokens the child is
# meant to read literally — `<sha>`, `<unix time>`, `<reason>`,
# `<design|scope|doc-conflict|stuck|wrap-up>`, `<path:line>`, `#<ticket>`, `ADR-<nnnn>` — are
# never substituted; the renderer fills a fixed, named set and nothing else.

[turn]
# The skeleton every child's first turn is composed into.
base = '''
<opening line>

Spec: <absolute spec path>
Your scope is this worktree and branch only; every path you write resolves inside it.

<workflow block>

<coordinator paragraph>

<escalation paragraph>

<completion paragraph>
'''

# The escalation paragraph, one body per kind. A manual run's developer prompt renders this same
# block, so the two cannot drift.
escalate = '''
Escalate — one compact message, then wait; the answer wakes you — at any phase, from before
your first edit to wrap-up, the moment one of these holds:
- design: a decision point on product goal, acceptance, architecture, a module boundary or a
  public interface. One message per phase: each decision point numbered, 2-3 options, your
  pick marked.
- scope, doc-conflict, stuck: the question in one paragraph, 2-3 options with yours marked.
  scope — finishing needs a change to the ticket's scope. doc-conflict — the spec, the ticket
  and the code disagree, or a review ends on `escalate`. stuck — the same obstacle has
  survived two attempts.
- wrap-up: the ticket is complete and leftovers remain. One line per leftover — what, its
  pointer, and whether it touches only this ticket, another ticket, or a public interface —
  and no recommendation: placing them is the ruling.
Everything else is yours to settle: code shape, naming, tests, a root-caused bug, a refactor
that changes no behaviour, what a document already answers.
Every message:
CREW ASK <NN> <design|scope|doc-conflict|stuck|wrap-up> — the body above, what the ruling
touches, then the pointers: ticket <absolute path>, branch <name>, and every fact as a pointer
— <path:line>, #<ticket>, ADR-<nnnn> — re-read as you write it, ts=<unix time>
Distil to about 250 words: the coordinator rules from this message and a witness brief that
checks its pointers. Progress, reasoning and assumptions belong in your commits and receipt.
'''

# A Claude child authenticates the coordinator by sender socket; the pid is known before launch.
coordinator_claude = '''
Your coordinator is the Claude session `<coordinator name>`. Its messages arrive as
cross-session messages from `uds:/tmp/cc-socks/<coordinator pid>.sock` — that socket is the
identity; the from-name is a session title, not an identity. Reply with SendMessage to
`<coordinator name>`; ListAgents shows the ref to attach on first send. Identical message
bodies are silently dropped as duplicates, so end every message with `ts=<unix time>`.
'''

# A Codex child has no message channel of its own: the bridge reads the final message of its turn.
coordinator_codex = '''
Your coordinator is outside your session and reads the final message of every turn you end —
never anything you print mid-turn. To send it one of the lines below, end your turn with that
line last and stop; its reply arrives as your next turn. Keep the `ts=<unix time>` stamp: it is
the run's record of when you sent.
'''

# The receipt paragraph every workflow but `acceptance` closes with. A Codex child has no channel
# of its own — its bridge reads the final message of the turn and writes the log from there — so
# this variant asks it to send, and it is also what a run dispatched without a machine log renders
# for either lane: there is no log path to name, so the sendable receipt is all a child can do.
completion = '''
When <completion condition> are complete, run `git rev-parse HEAD` and send all 40 characters of
its output:
CREW COMPLETE <sha> ts=<unix time>
If you cannot complete the ticket, send:
CREW FAILED <reason> ts=<unix time>
The verb line stands alone: it is the whole of that message's final line, and any prose
you add goes on the lines above it, never on the line itself.
'''

# The Claude lane's receipt: written straight to the run's machine log, which is where the driver
# verifies receipts from, so it never lands in the coordinator's conversation. The coordinator is
# woken by `CREW ASK` alone, which keeps SendMessage — it is the one message that needs an answer.
completion_claude = '''
When <completion condition> are complete, run `git rev-parse HEAD` and record the receipt in the
run's machine log yourself — this receipt is not a message to your coordinator:

python3 <machine log script> --log <machine log path> message \
  --role child --ticket <NN> --message 'CREW COMPLETE <sha> ts=<unix time>'

If you cannot complete the ticket, record the same way with:
CREW FAILED <reason> ts=<unix time>
The verb line stands alone: it is the whole of that message's final line, and any prose
you add goes on the lines above it, never on the line itself.
Send neither receipt with SendMessage: CREW ASK is the only line the coordinator is woken for.
'''

[workflows.tdd]
opening_line = "/implement <absolute ticket path>"
completion_condition = "implementation, tests, the review, and commit"
review_lane = true
block = '''
Workflow: tdd. Base commit for the review: <ticket base commit>.
Every expected value in a test derives from the ticket or the spec. A value read off your own
implementation's output restates the implementation and tests nothing. Where the ticket pins no
expected value for something you must assert, escalate for the value.
<review block>
'''

[workflows.refactor]
opening_line = "Refactor per <absolute ticket path>"
completion_condition = "characterization tests, refactor, the review, and commit"
review_lane = true
block = '''
Workflow: refactor. Base commit for the review: <ticket base commit>.
Behaviour is frozen; only its expression changes. Work characterization-tests-first:
1. Write characterization tests that pin today's behaviour and pass against the code as it stands
   — the suite is green before you change a line. There is no red phase in this workflow.
2. Refactor in steps, running the suite after each and keeping it green.
3. Those expectations stay exactly as written in step 1. A test that only passes once you edit its
   expected value means the behaviour moved: revert that step, or escalate if the ticket asks for
   the move.
4. Obtain the review below, then commit.
<review block>
'''

[workflows.direct]
opening_line = "Implement <absolute ticket path>"
completion_condition = "implementation and commit"
review_lane = false
block = '''
Workflow: direct. Implement it and commit — no test-first cycle, no test files added to satisfy
one, and no review. Write tests only where the ticket names them as part of the deliverable.
For a prose deliverable — a skill, AGENTS.md or CLAUDE.md, a document an agent reads — invoke
/mattpocock-skills:writing-for-agents before you write any of it, and follow it.
'''

[workflows.spike]
opening_line = "Investigate <absolute ticket path>"
completion_condition = "the findings document and commit"
review_lane = false
block = '''
Workflow: spike. The deliverable is one Markdown findings document, committed to the repo at the
path the ticket names; ship no production code and obtain no review.
Every claim carries a source — file and line, command and its output, or URL — and a confidence
level of high, medium, or low. Record a claim you could not source as an open question, and keep
low-confidence findings as findings: an honest low beats a guess dressed as high.
Claude children only: the /research and /prototype skills are available as execution tools.
'''

[workflows.ops]
opening_line = "Implement <absolute ticket path>"
completion_condition = "the end-to-end run and commit"
review_lane = false
block = '''
Workflow: ops. Verification here is an end-to-end run, not a unit test: exercise the real path in
a temporary root you create for the run, and let that run be the evidence the ticket works. Add
unit tests only where the ticket names them, and obtain no review.
Record in the commit message the commands you ran, the temp root you ran them in, and what they
printed.
'''

[workflows.acceptance]
opening_line = "Prepare <absolute ticket path>"
review_lane = false
block = '''
Workflow: acceptance. This ticket closes with a human, so your job is to leave them the shortest
possible path. Do every part of it an agent can do, then write a checklist at the path the ticket
names, or `acceptance-<NN>.md` beside the ticket's own deliverable when it names none, with two
headed sections:
- Verified — what you ran or read, each item with the evidence that settled it.
- Assumed — what you could not settle yourself, each item with the exact command, click-path, or
  question that would settle it, and what a pass looks like.
The checklist is resumable: a human picks it up cold, without rereading this run. Claiming an
Assumed item as Verified is the one failure this workflow exists to prevent.
'''
# `acceptance` is the one workflow that parks by receipt, so it replaces the completion paragraph.
completion = '''
Commit your preparation and the checklist, then park: send
CREW PARKED <absolute checklist path> ts=<unix time>
and stop — the checklist is the human's to run.
If you cannot reach that point, send:
CREW FAILED <reason> ts=<unix time>
The verb line stands alone: it is the whole of that message's final line, and any prose
you add goes on the lines above it, never on the line itself.
'''
# The same park, recorded rather than sent, for a Claude child on a run with a machine log.
completion_claude = '''
Commit your preparation and the checklist, then park: record the receipt in the run's machine log
yourself — this receipt is not a message to your coordinator:

python3 <machine log script> --log <machine log path> message \
  --role child --ticket <NN> --message 'CREW PARKED <absolute checklist path> ts=<unix time>'

and stop — the checklist is the human's to run.
If you cannot reach that point, record the same way with:
CREW FAILED <reason> ts=<unix time>
The verb line stands alone: it is the whole of that message's final line, and any prose
you add goes on the lines above it, never on the line itself.
Send neither receipt with SendMessage: CREW ASK is the only line the coordinator is woken for.
'''

[review]
block = '''
Review: <review vendor> at model <review model>, effort <review effort>. Once the work is in place
and before you commit it, run the installed Review-Switch command as a background or long-running
command and wait for its result. In Claude Bash, set `run_in_background: true`; a foreground Bash
call is killed at ten minutes, while Review-Switch permits a review to run for two hours.

review-bridge \
  --reviewer <review vendor> --cwd <review cwd> \
  --model <review model> --effort <review effort><review account> \
  --base <review base> --spec <review spec> --axis both<review hooks>

This command is the ticket's only review; it satisfies every review step any skill you invoke
asks of you.

Read the one JSON object through `axes`. Trust an axis report only when its `status` is `completed`
and its `finalMessage` is non-empty. Keep every completed axis. On `partially_completed`, rerun only
each failed axis once as a fresh single-axis review: replace `--axis both` with that axis's own name
and run without `--resume-session`. If that axis fails again, escalate with its reason and report.

For every trusted axis, do exactly what its `next` field permits and no other action. When it
requires a resumed review, reuse the command, replace `--axis both` with that axis's own name, and
add `--resume-session <reviewSessionId>` using that axis's `reviewSessionId`. When `next` says
`escalate`, send `CREW ASK <NN> doc-conflict` carrying both positions to your coordinator.

Any other top-level `status`, including `refused`, is not a report: send `CREW ASK <NN> stuck`
carrying its `next` and reason. Do not start or resume another review.

If the JSON object never reaches you, add `--recover-session` to the same command instead of
starting another review. It waits for every live axis or returns an undelivered report. Exit code 3
means there is nothing to recover and is the only result that permits a fresh review. Any other
recovery failure gets one retry, then an escalation carrying the command's output.
'''

# Review-Switch fires these commands at the lifecycle points it owns. They use the run's own copy
# of the machine-log writer, so a plugin upgrade cannot move an in-flight run's event vocabulary.
[review.hooks]
on-review-start = '''
python3 <machine log script>
  --log <machine log path> review
  --ticket <NN> --lane <review lane> --state running
'''
on-axis-end = '''
set -- python3 <machine log script>
  --log <machine log path> session-cost
  --ticket <NN> --executor <review vendor> --model "$REVIEW_MODEL"
  --lane <review lane>;
if [ -n "$REVIEW_SESSION" ]; then
  set -- "$@" --session "$REVIEW_SESSION";
fi;
if [ "${REVIEW_COST_DETAIL+x}" = x ]; then
  set -- "$@" --detail "$REVIEW_COST_DETAIL";
else
  total="$((REVIEW_INPUT_TOKENS + REVIEW_OUTPUT_TOKENS +
    REVIEW_CACHE_READ_TOKENS + REVIEW_CACHE_CREATION_TOKENS))";
  set -- "$@"
    --input-tokens "$REVIEW_INPUT_TOKENS"
    --output-tokens "$REVIEW_OUTPUT_TOKENS"
    --cache-read-tokens "$REVIEW_CACHE_READ_TOKENS"
    --cache-creation-tokens "$REVIEW_CACHE_CREATION_TOKENS"
    --total-tokens "$total";
fi;
"$@"
'''
on-review-end = '''
python3 <machine log script>
  --log <machine log path> review
  --ticket <NN> --lane <review lane> --state returned
'''

[models]
# ADR-0003: model names are always full IDs, because an alias was measured to resolve to a
# different model than the table approved. A bare vendor-less word — `opus`, `haiku` — is one, but
# so is a versioned name a vendor routes onward, which is why this is a list and not a shape test.
# A context-window suffix belongs to whatever it is attached to: `sonnet[1m]` is still this alias,
# `claude-opus-5[1m]` is still that full ID, so strip it before looking a name up here.
aliases = [
    # Claude
    "opus",
    "opusplan",
    "sonnet",
    "haiku",
    "fable",
    "default",
    "inherit",
    # OpenAI: `gpt-5.6` routes to `gpt-5.6-sol`. The `-sol`, `-terra`, and `-luna` names it routes
    # among are full IDs and belong nowhere near this list.
    "gpt-5.6",
]

[manual]
# The prompt pair a run without a driver pastes by hand — one resident coordinator session (the
# "advisor") and one developer session per ticket. Both render from the blocks above and from the
# crew skill's `## Contract`, so a manual run and `/crew` speak one text. Rendered by the dispatch
# renderer's roles command; nothing here is typed out a second time.
advisor = '''
You are the coordinator of this run: the human's proxy on product and technical direction, and
the developer sessions' final word. Spec: <absolute spec path>.

<contract>
'''

developer = '''
Your coordinator is the Claude session `<coordinator name>`; reply with SendMessage to it, ending
every message with `ts=<unix time>`. Spec: <absolute spec path>. Ticket: <absolute ticket path>.

<escalation paragraph>
Before sending, run `<witness command>` and paste its brief under the message.
'''

[agent]
# The `--agents` entry a Claude child is launched under. `prompt` is required for the CLI to
# register the agent at all; the child's real brief is the `initialPrompt` the renderer composes.
description = "AgentCrew child session for one ticket"
prompt = "You are an AgentCrew child session implementing exactly one ticket in its own worktree."
