# The renderer's first-turn library: the turn skeleton, one shape per `Workflow` value, and one
# review-lane variant per reviewing vendor. The dispatch renderer is the only reader; the crew
# skill body states none of this prose, so the text a child receives and the code that composes it
# cannot drift apart.
#
# Every `<token>` a block leaves open is filled from the approved wave table. Tokens the child is
# meant to read literally — `<sha>`, `<unix time>`, `<reason>`, `<doc-conflict|stuck|scope>` — are
# never substituted; the renderer fills a fixed, named set and nothing else.

[turn]
# The skeleton every child's first turn is composed into.
base = '''
<opening line>

Spec: <absolute spec path>
Your scope is this worktree and branch only; every path you write resolves inside it.

<workflow block>

<coordinator paragraph>

Escalate — one compact message, then wait; the answer wakes you — the moment any of these holds:
the spec, the ticket, and the code disagree; the same obstacle has survived two attempts;
finishing needs a change to the ticket's scope. Format:
CREW ASK <NN> <doc-conflict|stuck|scope> — question in one paragraph, 2-3 options with
yours marked, then the pointers: ticket <absolute path>, branch <name>, and the files or
diffs at issue, ts=<unix time>
Distil: the coordinator decides from this message alone and does not read your files, so
carry every pointer it would otherwise have to hunt for.

<completion paragraph>
'''

# A Claude child authenticates the coordinator by sender socket; the pid is known before launch.
coordinator_claude = '''
Your coordinator is the Claude session `<coordinator name>`. Its messages arrive as
cross-session messages from `uds:/tmp/cc-socks/<coordinator pid>.sock` — that socket is the
identity; the from-name is a session title, not an identity. Reply with SendMessage to
`<coordinator name>`; ListAgents shows the ref to attach on first send. Identical message
bodies are silently dropped as duplicates, so end every message with `ts=<unix time>`.
'''

# A Codex child has no message channel of its own: the bridge reads the final message of its turn.
coordinator_codex = '''
Your coordinator is outside your session and reads the final message of every turn you end —
never anything you print mid-turn. To send it one of the lines below, end your turn with that
line last and stop; its reply arrives as your next turn. Keep the `ts=<unix time>` stamp: it is
the run's record of when you sent.
'''

# The receipt paragraph every workflow but `acceptance` closes with.
completion = '''
When <completion condition> are complete, run `git rev-parse HEAD` and send all 40 characters of
its output:
CREW COMPLETE <sha> ts=<unix time>
If you cannot complete the ticket, send:
CREW FAILED <reason> ts=<unix time>
'''

[workflows.tdd]
opening_line = "/implement <absolute ticket path>"
completion_condition = "implementation, tests, the review, and commit"
review_lane = true
block = '''
Workflow: tdd. Base commit for the review: <ticket base commit>.
Every expected value in a test derives from the ticket or the spec. A value read off your own
implementation's output restates the implementation and tests nothing. Where the ticket pins no
expected value for something you must assert, escalate for the value.
<review block>
'''

[workflows.refactor]
opening_line = "Refactor per <absolute ticket path>"
completion_condition = "characterization tests, refactor, the review, and commit"
review_lane = true
block = '''
Workflow: refactor. Base commit for the review: <ticket base commit>.
Behaviour is frozen; only its expression changes. Work characterization-tests-first:
1. Write characterization tests that pin today's behaviour and pass against the code as it stands
   — the suite is green before you change a line. There is no red phase in this workflow.
2. Refactor in steps, running the suite after each and keeping it green.
3. Those expectations stay exactly as written in step 1. A test that only passes once you edit its
   expected value means the behaviour moved: revert that step, or escalate if the ticket asks for
   the move.
4. Obtain the review below, then commit.
<review block>
'''

[workflows.direct]
opening_line = "Implement <absolute ticket path>"
completion_condition = "implementation and commit"
review_lane = false
block = '''
Workflow: direct. Implement it and commit — no test-first cycle, no test files added to satisfy
one, and no review. Write tests only where the ticket names them as part of the deliverable.
For a prose deliverable — a skill, AGENTS.md or CLAUDE.md, a document an agent reads — invoke
/mattpocock-skills:writing-for-agents before you write any of it, and follow it.
'''

[workflows.spike]
opening_line = "Investigate <absolute ticket path>"
completion_condition = "the findings document and commit"
review_lane = false
block = '''
Workflow: spike. The deliverable is one Markdown findings document, committed to the repo at the
path the ticket names; ship no production code and obtain no review.
Every claim carries a source — file and line, command and its output, or URL — and a confidence
level of high, medium, or low. Record a claim you could not source as an open question, and keep
low-confidence findings as findings: an honest low beats a guess dressed as high.
Claude children only: the /research and /prototype skills are available as execution tools.
'''

[workflows.ops]
opening_line = "Implement <absolute ticket path>"
completion_condition = "the end-to-end run and commit"
review_lane = false
block = '''
Workflow: ops. Verification here is an end-to-end run, not a unit test: exercise the real path in
a temporary root you create for the run, and let that run be the evidence the ticket works. Add
unit tests only where the ticket names them, and obtain no review.
Record in the commit message the commands you ran, the temp root you ran them in, and what they
printed.
'''

[workflows.acceptance]
opening_line = "Prepare <absolute ticket path>"
review_lane = false
block = '''
Workflow: acceptance. This ticket closes with a human, so your job is to leave them the shortest
possible path. Do every part of it an agent can do, then write a checklist at the path the ticket
names, or `acceptance-<NN>.md` beside the ticket's own deliverable when it names none, with two
headed sections:
- Verified — what you ran or read, each item with the evidence that settled it.
- Assumed — what you could not settle yourself, each item with the exact command, click-path, or
  question that would settle it, and what a pass looks like.
The checklist is resumable: a human picks it up cold, without rereading this run. Claiming an
Assumed item as Verified is the one failure this workflow exists to prevent.
'''
# `acceptance` is the one workflow that parks by receipt, so it replaces the completion paragraph.
completion = '''
Commit your preparation and the checklist, then park: send
CREW PARKED <absolute checklist path> ts=<unix time>
and stop — the checklist is the human's to run.
If you cannot reach that point, send:
CREW FAILED <reason> ts=<unix time>
'''

[review]
# Both variants close with the same contract; the reviewed child is the party that reads it.
rounds = '''
Rounds. Classify each finding on two axes: standards — style, naming, convention, anything that
leaves behaviour intact — and spec — correctness, security, deviation from the spec or ticket.
Fix the standards findings you accept in one pass; they are done without re-review. Spec findings
that required fixes get one re-review, scoped to exactly those fixes. Most reviews end clean after
the first pass — the re-review is a cap, not a stage to fill.
A spec finding still open after that re-review, or a finding the reviewer reopens after you ruled
on it, ends the review: send your coordinator a CREW ASK carrying both positions, rather
than opening another round.
'''

# The reviewer is always the vendor that did not implement, so the variant is keyed by that vendor.
[review.codex]
block = '''
Review: codex at model <review model>, effort <review effort>. Once the work is in place and
before you commit it, run:

python3 <crew-skill-dir>/assets/review/scripts/tui_review_bridge.py \
  --cwd <worktree-abs-path> --model <review model> --effort <review effort> \
  -- 'the changes in this worktree since <ticket base commit>'

This command is the ticket's only review; it satisfies every review step any skill you invoke
asks of you.

The bridge prints one JSON object. A `status` of `completed` with a non-empty `finalMessage` is
the report; keep `reviewSessionId` and pass it back as `--resume-session '<reviewSessionId>'` on
the same command for round two, so the follow-up still sees round one's findings and can say which
of them the fixes closed. A `status` of `interrupted` carrying a `reviewSessionId` is a resumable
pane: resume it the same way. Any other result is a failed review — retry once, then escalate with
exactly what the bridge printed.

<rounds contract>
'''

[review.claude]
block = '''
Review: claude at model <review model>, effort <review effort>. You have no Claude session of your
own, so a headless one reviews for you. Once the work is in place and before you commit it, run:

python3 <crew-skill-dir>/assets/review/scripts/claude_review_bridge.py \
  --cwd <worktree-abs-path> --model <review model> --effort <review effort> \
  'the changes in this worktree since <ticket base commit>'

This command is the ticket's only review; it satisfies every review step any skill you invoke
asks of you.

The bridge prints one JSON object: `findings` is the report, and `lineageId` is the handle for
round two. Keep that handle and pass it back — the same command plus `--resume-session
'<lineageId>'` — so the follow-up review still sees round one's findings and can say which of them
the fixes closed.

Read `status`, `exitCode`, and `permissionDenials` before you trust the report: a status of
`error`, a nonzero exit, or any denial means the review is partial or absent. Retry once, then
escalate with what the bridge printed and the `logFile` path it names.

<rounds contract>
'''

[models]
# ADR-0003: model names are always full IDs, because an alias was measured to resolve to a
# different model than the table approved. A bare vendor-less word — `opus`, `haiku` — is one, but
# so is a versioned name a vendor routes onward, which is why this is a list and not a shape test.
# A context-window suffix belongs to whatever it is attached to: `sonnet[1m]` is still this alias,
# `claude-opus-5[1m]` is still that full ID, so strip it before looking a name up here.
aliases = [
    # Claude
    "opus",
    "opusplan",
    "sonnet",
    "haiku",
    "fable",
    "default",
    "inherit",
    # OpenAI: `gpt-5.6` routes to `gpt-5.6-sol`. The `-sol`, `-terra`, and `-luna` names it routes
    # among are full IDs and belong nowhere near this list.
    "gpt-5.6",
]

[agent]
# The `--agents` entry a Claude child is launched under. `prompt` is required for the CLI to
# register the agent at all; the child's real brief is the `initialPrompt` the renderer composes.
description = "AgentCrew child session for one ticket"
prompt = "You are an AgentCrew child session implementing exactly one ticket in its own worktree."
